services:
  - type: web
    name: afrivoice-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DATABASE
        value: afrivoice
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
