services:
  - type: web
    name: afrivoice-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DATABASE
        value: afrivoice
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://afrivoice-ai-9mzt.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: CORS_ORIGINS
        value: "https://afrivoice-ai-9mzt.onrender.com,https://afri-voice-ai.vercel.app,http://localhost:5173,https://afri-voice-fv1ozwxl0-afri-voice-ai.vercel.app,https://afri-voice-acxo2w7xm-afri-voice-ai.vercel.app"
      - key: AI_MODE
        value: gemini
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MONTHLY_GENERATION_LIMIT
        value: "30"
