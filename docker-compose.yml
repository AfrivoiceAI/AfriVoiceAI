services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
    ports: ["27017:27017"]
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    volumes: [ollama_data:/root/.ollama]
    ports: ["11434:11434"]
  api:
    build: ./backend
    env_file: .env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on: [mongo]
    ports: ["8000:8000"]
    volumes: [api_uploads:/app/uploads]
  frontend:
    build: ./frontend
    environment: [VITE_API_URL=http://localhost:8000/api/v1]
    depends_on: [api]
    ports: ["5173:5173"]
volumes:
  mongo_data:
  ollama_data:
  api_uploads:
